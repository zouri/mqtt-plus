<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MQTT Plus app icon">
  <defs>
    <linearGradient id="base" x1="146" y1="118" x2="880" y2="918" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#730081"/>
      <stop offset="0.56" stop-color="#510064"/>
      <stop offset="1" stop-color="#251632"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="-180" x2="1204" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55E6C1"/>
      <stop offset="1" stop-color="#25B997"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="80" y="80" width="864" height="864" rx="202"/>
    </clipPath>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="202" fill="url(#base)"/>
  <rect x="81" y="81" width="862" height="862" rx="201" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- A shallow accent curve adds one layer beyond the three message channels. -->
  <path d="M0-180Q732 292 1204 1024" fill="none" stroke="url(#accent)" stroke-width="76" clip-path="url(#tile)"/>
  <!-- Gently curved message channels are distributed across the tile. -->
  <g fill="none" stroke="#FAF7FB" stroke-width="76" clip-path="url(#tile)">
    <path d="M0 60Q586 438 964 1024"/>
    <path d="M0 300Q440 584 724 1024"/>
    <path d="M0 540Q294 730 484 1024"/>
  </g>
</svg>
